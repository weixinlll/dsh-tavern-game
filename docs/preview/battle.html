<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>战斗插件静态样例</title><style>body{box-sizing:border-box;width:100%;margin:0;background:#0B0C0A;padding:12px}main{box-sizing:border-box;width:calc(100% - 48px);max-width:1050px;margin:auto}
.dshb{width:100%;min-width:0;box-sizing:border-box;background:#0B0C0A;color:#eee;font:14px/1.6 "IBM Plex Mono","JetBrains Mono",monospace;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;padding:16px;border:1px solid #454640}
.dshb *{box-sizing:border-box}.dshb h2,.dshb h3,.dshb p{margin:0 0 12px}.dshb h2{font-size:20px}.dshb h3{font-size:15px}.dshb button,.dshb input,.dshb select,.dshb textarea{font:inherit;color:inherit;min-height:44px;background:#0B0C0A;border:1px solid #77786e;padding:9px 12px;max-width:100%;border-radius:0}.dshb button{cursor:pointer}.dshb button:hover:not(:disabled){border-color:#FFB800;color:#FFB800}.dshb button:focus-visible,.dshb input:focus-visible,.dshb select:focus-visible,.dshb textarea:focus-visible,.dshb summary:focus-visible{outline:2px solid #FFB800;outline-offset:3px}.dshb button:disabled{cursor:not-allowed;opacity:.45}.dshb button[aria-pressed=true],.dshb .dshb-primary{border-color:#FFB800;color:#FFB800}.dshb textarea{width:100%;resize:vertical}.dshb input[type=checkbox]{min-height:24px;width:24px;accent-color:#FFB800}.dshb label{display:block;margin:12px 0}.dshb label input:not([type=checkbox]),.dshb label select{width:100%;margin-top:5px}.dshb label:has(input[type=checkbox]){display:flex;align-items:center;gap:10px}.dshb small,.dshb .dshb-muted{color:#b4b6aa}.dshb small{display:block}.dshb .dshb-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.dshb .dshb-toolbar>h2{margin:0;flex:1}.dshb .dshb-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.dshb .dshb-unit{min-width:0;padding:12px;border:1px solid #454640;margin-bottom:8px}.dshb .dshb-unit[data-down=true]{opacity:.5}.dshb .dshb-unithead{display:flex;justify-content:space-between;gap:8px}.dshb .dshb-hp{height:8px;background:#34352f;margin:8px 0}.dshb .dshb-hp>span{height:100%;display:block;background:#FFB800}.dshb .dshb-res{display:flex;flex-wrap:wrap;gap:12px}.dshb .dshb-actions{display:flex;flex-wrap:wrap;gap:8px}.dshb .dshb-actions>button{flex:1 1 130px;text-align:left}.dshb .dshb-section{border-top:1px solid #454640;padding-top:12px;margin-top:12px}.dshb .dshb-notice{border-left:3px solid #FFB800;padding:8px 12px;margin:12px 0}.dshb .dshb-report{white-space:pre-wrap}.dshb details{border-top:1px solid #454640;padding-top:12px;margin-top:12px}.dshb summary{cursor:pointer;min-height:44px}.dshb ol{padding-left:24px}.dshb li{padding-bottom:6px}.dshb .dshb-badge{display:inline-block;color:#FFB800;border:1px solid #FFB800;padding:3px 8px;max-width:100%;font-size:13px}.dshb.dshb-marker{display:inline-block;width:auto;padding:0;border:0}.dshb.dshb-overlay{min-height:100%;max-width:1100px;margin:0 auto;padding:24px}.dshb .dshb-fieldset{min-width:0;max-width:100%;border:1px solid #454640;padding:12px;margin:12px 0}.dshb pre{white-space:pre-wrap;max-height:240px;overflow:auto}.dshb .dshb-linkrow{display:flex;flex-wrap:wrap;gap:8px}
@media(max-width:540px){.dshb,.dshb.dshb-overlay{padding:12px}.dshb .dshb-grid{grid-template-columns:1fr}.dshb .dshb-toolbar>h2{flex-basis:100%}.dshb .dshb-actions>button{flex-basis:calc(50% - 8px)}.dshb .dshb-toolbar>button{flex:1}}
</style><main><section class="dshb" aria-label="战斗面板"><div class="dshb-toolbar"><h2>回合制战斗</h2><button>刷新</button></div><p class="dshb-notice">静态预览样例：不连接酒馆，不调用模型。</p><p class="dshb-muted">人类对决 · 第 1 回合 · 操作 1</p><div class="dshb-grid"><div><h3>我方</h3><div class="dshb-unit"><div class="dshb-unithead"><strong>样例：主角</strong><span>体力 34/40</span></div><div class="dshb-hp" role="progressbar" aria-label="样例：主角生命" aria-valuenow="34" aria-valuemin="0" aria-valuemax="40"><span style="width:85%"></span></div><div class="dshb-res"></div></div></div><div><h3>敌方</h3><div class="dshb-unit"><div class="dshb-unithead"><strong>样例：守卫</strong><span>体力 25/40</span></div><div class="dshb-hp" role="progressbar" aria-label="样例：守卫生命" aria-valuenow="25" aria-valuemin="0" aria-valuemax="40"><span style="width:62.5%"></span></div><div class="dshb-res"></div></div></div></div><div class="dshb-section"><h3>选择目标</h3><div class="dshb-actions"><button aria-pressed="">样例：守卫</button></div><h3 style="margin-top:16px">选择技能</h3><div class="dshb-actions"><button title="">直拳<small>无消耗</small></button><button title="">重击<small>无消耗</small></button><button title="">佯攻<small>无消耗</small></button><button title="">架势<small>无消耗</small></button></div></div><details><summary>战斗报告</summary><p class="dshb-report">静态样例报告。实际报告由宿主生成。</p></details><details><summary>战报 · 2 条</summary><ol><li>样例：主角使用直拳，守卫受到 8 点伤害。</li><li>样例：守卫反击，主角受到 6 点伤害。</li></ol></details></section></main></html>
